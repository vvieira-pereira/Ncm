name: Rotina diaria do banco

# Segredos (Settings > Secrets and variables > Actions > Repository secrets):
#   SUPABASE_URL              URL do projeto (https://<ref>.supabase.co)
#   SUPABASE_PUBLISHABLE_KEY  chave publicavel (sb_publishable_...); nunca a secreta
#   DISCORD_WEBHOOK_URL       URL do webhook do canal do Discord
# Nenhum valor sensivel fica neste arquivo.

on:
  schedule:
    # 18h30 de Brasilia (21h30 UTC). O primeiro passo espera ate as 19h; assim o aviso chega perto das 19h
    # mesmo que o GitHub adiante ou atrase um pouco o inicio.
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotina-diaria-banco
  cancel-in-progress: false

jobs:
  buscas:
    name: 15 buscas no banco
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Aguardar as 19h de Brasilia
        # So nas execucoes agendadas. Execucao manual ("Run workflow") roda na hora, para teste.
        if: github.event_name == 'schedule'
        run: |
          ALVO=$(date -u -d 'today 22:00:00' +%s)
          AGORA=$(date -u +%s)
          ESPERA=$((ALVO - AGORA))
          if [ "$ESPERA" -gt 0 ] && [ "$ESPERA" -le 2400 ]; then
            echo "Aguardando ${ESPERA}s ate as 19h de Brasilia."
            sleep "$ESPERA"
          else
            echo "Sem espera (${ESPERA}s)."
          fi

      - name: Fazer as 15 buscas no banco
        id: buscas
        run: bash scripts/keep-alive.sh

      - name: Avisar no Discord (concluido)
        if: success() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          set -u
          HORA=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M (Brasília)')
          jq -n \
            --arg projeto "${GITHUB_REPOSITORY#*/}" \
            --arg hora "$HORA" \
            --arg ok "${{ steps.buscas.outputs.ok }}" \
            --arg linhas "${{ steps.buscas.outputs.linhas }}" \
            --arg banco "${{ steps.buscas.outputs.banco }}" \
            --arg duracao "${{ steps.buscas.outputs.duracao }}" '{
            embeds: [{
              title: ($projeto + ": 15 buscas no banco concluídas"),
              description: "As 15 buscas da rotina diária foram feitas no banco e todas tiveram resposta.",
              color: 3066993,
              fields: [
                { name: "Buscas", value: ($ok + " de 15"), inline: true },
                { name: "Linhas lidas", value: $linhas, inline: true },
                { name: "Códigos no banco", value: $banco, inline: true },
                { name: "Duração", value: ($duracao + " s"), inline: true },
                { name: "Quando", value: $hora, inline: true }
              ],
              footer: { text: "Rotina diária das 19h" }
            }]
          }' > discord.json
          curl -fsS --max-time 15 -H "Content-Type: application/json" -X POST \
            -d @discord.json "$DISCORD_WEBHOOK_URL" > /dev/null \
            || echo "::warning::Nao foi possivel enviar ao Discord. Confira DISCORD_WEBHOOK_URL."

      - name: Avisar no Discord (falha)
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          set -u
          HORA=$(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M (Brasília)')
          EXECUCAO="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n \
            --arg projeto "${GITHUB_REPOSITORY#*/}" \
            --arg hora "$HORA" \
            --arg ok "${{ steps.buscas.outputs.ok || '0' }}" \
            --arg url "$EXECUCAO" '{
            embeds: [{
              title: ($projeto + ": rotina do banco falhou"),
              description: ("Só " + $ok + " de 15 buscas tiveram resposta. Veja o log e se o projeto está pausado no painel do Supabase."),
              color: 15158332,
              fields: [
                { name: "Quando", value: $hora, inline: true },
                { name: "Execução", value: $url, inline: false }
              ],
              footer: { text: "Rotina diária das 19h" }
            }]
          }' > discord.json
          curl -fsS --max-time 15 -H "Content-Type: application/json" -X POST \
            -d @discord.json "$DISCORD_WEBHOOK_URL" > /dev/null \
            || echo "::warning::Nao foi possivel enviar ao Discord. Confira DISCORD_WEBHOOK_URL."
